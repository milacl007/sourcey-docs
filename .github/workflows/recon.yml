name: runx-recon
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: install runx (npm, fallback curl)
        run: |
          npm install -g @runxhq/cli 2>&1 | tail -3 || true
          curl -fsSL https://runx.ai/install | sh 2>&1 | tail -5 || true
          echo "$HOME/.runx/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH
      - name: version + help
        run: |
          echo "--- which runx ---"; which runx || ls -la $HOME/.runx/bin $HOME/.local/bin 2>/dev/null || true
          echo "--- version ---"; runx --version 2>&1 || true
          echo "--- help ---"; runx --help 2>&1 | head -70 || true
      - name: search catalog for docs skills
        run: |
          for q in sourcey docs documentation library apiref; do
            echo "===== search: $q ====="; runx registry search "$q" 2>&1 | head -40 || true
          done
